<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SASjs Angular Seed App - an Angular app talking to SAS</title>

    <!-- what a search engine and a link preview read -->
    <meta
      name="description"
      content="A low-maintenance Angular seed app for SASjs: three SAS services, a file upload and a SAS logs panel that marks errors, warnings and notable notes - with a browser-hosted backend, so it runs without a SAS server."
    />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="canonical" href="https://angular.sasjs.io/" />

    <!-- Open Graph: LinkedIn, Slack, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SASjs" />
    <meta property="og:title" content="SASjs Angular Seed App" />
    <meta
      property="og:description"
      content="Angular + @sasjs/adapter, talking to SAS through services, uploads and SAS logs. Ships with a browser-hosted backend, so it runs without a SAS server."
    />
    <meta property="og:url" content="https://angular.sasjs.io/" />
    <meta
      property="og:image"
      content="https://angular.sasjs.io/assets/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SASjs Angular Seed App - Angular + @sasjs/adapter, talking to SAS"
    />

    <!-- Twitter / X uses these, and falls back to Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SASjs Angular Seed App" />
    <meta
      name="twitter:description"
      content="Angular + @sasjs/adapter, talking to SAS through services, uploads and SAS logs."
    />
    <meta
      name="twitter:image"
      content="https://angular.sasjs.io/assets/og-image.png"
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <base href="./" />

    <!--
      The adapter reads this element at start-up. It is the documented way to
      configure a SASjs app, and the sasjs CLI rewrites it per target: `sasjs
      build -t mock` turns the app into one that talks to its browser-hosted
      backend, which is what makes the published demo work without a server.
    -->
    <sasjs
      serverType="SASJS"
      appLoc="/Public/app/angular-seed-app"
      debug="true"
    ></sasjs>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
